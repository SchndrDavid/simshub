name: simshub

services:
  simshub:
    build: .
    image: simshub
    container_name: simshub
    restart: unless-stopped

    # UID/GID must match the owner of ./data, otherwise SQLite cannot write.
    user: "${SIMSHUB_UID:-1000}:${SIMSHUB_GID:-1000}"

    ports:
      - "${SIMSHUB_PORT:-8105}:8000"

    volumes:
      - ./data:/data

    environment:
      PORT: 8000
      SIMSHUB_DB_PATH: /data/simshub.db

    # The probe runs inside the container; the slim image has no curl, so
    # it asks node instead. The port comes from env so the probe follows
    # an overridden PORT.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || '8000') + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
